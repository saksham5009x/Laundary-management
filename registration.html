
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WashWise | Registration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <div class="logo">WashWise 🧺</div>
    <nav>
        <a href="home.html">Home</a>
        <a href="features.html">Features</a>
        <a href="how-it-works.html">How It Works</a>
        <a href="login.html">Student Login</a>
        <a href="registration.html">Register</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>

<section class="section">
    <div class="form-box">
        <h1>Student Registration</h1>

        <form id="registrationForm">
            <label>Full Name</label>
            <input type="text" id="studentName" placeholder="Enter Full Name" required>

            <label>Student ID</label>
            <input type="text" id="studentId" placeholder="Enter Student ID" required>

            <label>Email</label>
            <input type="email" id="studentEmail" placeholder="Enter Email" required>

            <label>Room Number</label>
            <input type="text" id="room" placeholder="Enter Room Number" required>

            <label>Password</label>
            <input type="password" id="studentPassword" placeholder="Create Password" required>

            <button type="submit" class="btn">Register Now</button>
            <p id="registrationMessage"></p>
        </form>
    </div>
</section>

<footer>
    <p>© 2026 WashWise. All Rights Reserved.</p>
</footer>

<script src="script.js"></script>
</body>
</html>
